[project]
name = "openadjust"
version = "0.1.0"
description = "Educational geodetic network adjustment software"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "Dein Name", email = "deine@email.de" }
]
keywords = ["geodesy", "surveying", "least-squares", "adjustment", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pyqt6>=6.6.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
]
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=2.0.0",
]

[project.scripts]
openadjust = "openadjust.__main__:main"

[project.gui-scripts]
openadjust-gui = "openadjust.__main__:main"

[project.urls]
Homepage = "https://github.com/DEIN-USERNAME/OpenAdjust"
Documentation = "https://openadjust.readthedocs.io"
Repository = "https://github.com/DEIN-USERNAME/OpenAdjust"
Issues = "https://github.com/DEIN-USERNAME/OpenAdjust/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openadjust"]

# ============================================================
# Tool-Konfigurationen
# ============================================================

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP"]
ignore = ["D100", "D104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=openadjust --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/openadjust"]
branch = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
